services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: 'postgres_db'
    restart: 'always'
    environment:
      - 'POSTGRES_DB=db_test'
      - 'POSTGRES_PASSWORD=db_test40'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5432:5432'
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'

  redis:
    image: 'redis:7-alpine'
    container_name: 'redis_cache'
    restart: 'always'
    ports:
      - '6379:6379'
    volumes:
      - 'redis_data:/data'

  api:
    build:
      context: '.'
      dockerfile: 'Dockerfile'
    container_name: 'spring_backend_test'
    restart: 'always'
    ports:
      - '8080:8080'
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/db_test'
      - 'SPRING_DATASOURCE_USERNAME=postgres'
      - 'SPRING_DATASOURCE_PASSWORD=db_test40'
      - 'SPRING_DATA_REDIS_HOST=redis'
      - 'SPRING_DATA_REDIS_PORT=6379'
    depends_on:
      - 'redis'
      - 'postgres'

volumes:
  postgres_data:
  redis_data: